services:
  postgres:
    image: postgres:18
    container_name: mini-graph-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_graph
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_graph"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - mini_graph_pgdata:/var/lib/postgresql

volumes:
  mini_graph_pgdata:
